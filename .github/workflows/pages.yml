# old-book-typing 폴더(사이트 첫 화면)와 manga-translator 폴더(/manga/)를 GitHub Pages 로 자동 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 주세요.
name: Deploy site (옛글자 + 말풍선)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["old-book-typing/**", "manga-translator/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 옛글자는 지금 주소(/) 그대로, 만화 번역기는 /manga/ 에 올린다
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r old-book-typing/. _site/
          cp -r manga-translator _site/manga
          rm -f _site/manga/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
