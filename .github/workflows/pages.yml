# old-book-typing 폴더를 GitHub Pages 웹사이트로 자동 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔 주세요.
name: Deploy 옛글자 site

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: ["old-book-typing/**", ".github/workflows/pages.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: old-book-typing
      - id: deployment
        uses: actions/deploy-pages@v4
